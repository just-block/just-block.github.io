# To enable this workflow:
# 1. Go to GitHub repo → Settings → Secrets and variables → Actions → Variables tab
# 2. Click "New repository variable"
# 3. Name: ENABLE_LANDING_DEPLOY, Value: true
# 4. Save — the workflow will run on next push to packages/landing/** or manual dispatch

name: Landing

on:
  push:
    branches: ["main"]
    paths:
      - "packages/landing/**"
      - "packages/api/shared/**"
      - "package.json"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: ${{ vars.ENABLE_LANDING_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build website
        run: pnpm run -F=landing build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/landing/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
